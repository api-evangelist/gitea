openapi: 3.2.0
info:
  description: This documentation describes the Gitea API.
  title: Gitea User API
  license:
    name: MIT
    url: http://opensource.org/licenses/MIT
  version: 29.0.0+dev-153-gba4f8fa246
servers:
- url: /api/v1
security:
- BasicAuth: []
- Token: []
- AccessToken: []
- AuthorizationHeaderToken: []
- SudoParam: []
- SudoHeader: []
- TOTPHeader: []
tags:
- description: The authenticated user
  name: User
paths:
  /user:
    get:
      tags:
      - User
      summary: Get the authenticated user
      operationId: userGetCurrent
      responses:
        '200':
          $ref: '#/components/responses/User'
  /user/actions/jobs:
    get:
      tags:
      - User
      summary: Get workflow jobs
      operationId: getUserWorkflowJobs
      parameters:
      - description: workflow status (requested, pending, queued, in_progress, failure, success, skipped)
        name: status
        in: query
        schema:
          type: string
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      - description: sort jobs by attribute. Supported values are "id". Default is "id"
        name: sort
        in: query
        schema:
          type: string
      - description: sort order, either "asc" (ascending) or "desc" (descending). Default is "asc"
        name: order
        in: query
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/WorkflowJobsList'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/validationError'
  /user/actions/runners:
    get:
      tags:
      - User
      summary: Get user-level runners
      operationId: getUserRunners
      parameters:
      - description: filter by disabled status (true or false)
        name: disabled
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/RunnerList'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
  /user/actions/runners/registration-token:
    post:
      tags:
      - User
      summary: Get a user's actions runner registration token
      operationId: userCreateRunnerRegistrationToken
      responses:
        '200':
          $ref: '#/components/responses/RegistrationToken'
  /user/actions/runners/{runner_id}:
    get:
      tags:
      - User
      summary: Get a user-level runner
      operationId: getUserRunner
      parameters:
      - description: id of the runner
        name: runner_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/Runner'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      tags:
      - User
      summary: Delete a user-level runner
      operationId: deleteUserRunner
      parameters:
      - description: id of the runner
        name: runner_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: runner has been deleted
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
    patch:
      tags:
      - User
      summary: Update a user-level runner
      operationId: updateUserRunner
      parameters:
      - description: id of the runner
        name: runner_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/Runner'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/validationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditActionRunnerOption'
  /user/actions/runs:
    get:
      tags:
      - User
      summary: Get workflow runs
      operationId: getUserWorkflowRuns
      parameters:
      - description: workflow event name
        name: event
        in: query
        schema:
          type: string
      - description: workflow branch
        name: branch
        in: query
        schema:
          type: string
      - description: workflow status (requested, pending, queued, in_progress, failure, success, skipped)
        name: status
        in: query
        schema:
          type: string
      - description: triggered by user
        name: actor
        in: query
        schema:
          type: string
      - description: triggering sha of the workflow run
        name: head_sha
        in: query
        schema:
          type: string
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/WorkflowRunsList'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
  /user/actions/secrets/{secretname}:
    put:
      tags:
      - User
      summary: Create or Update a secret value in a user scope
      operationId: updateUserSecret
      parameters:
      - description: name of the secret
        name: secretname
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: response when creating a secret
        '204':
          description: response when updating a secret
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateSecretOption'
    delete:
      tags:
      - User
      summary: Delete a secret in a user scope
      operationId: deleteUserSecret
      parameters:
      - description: name of the secret
        name: secretname
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: delete one secret of the user
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
  /user/actions/variables:
    get:
      tags:
      - User
      summary: Get the user-level list of variables which is created by current doer
      operationId: getUserVariablesList
      parameters:
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/VariableList'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
  /user/actions/variables/{variablename}:
    get:
      tags:
      - User
      summary: Get a user-level variable which is created by current doer
      operationId: getUserVariable
      parameters:
      - description: name of the variable
        name: variablename
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/ActionVariable'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
    put:
      tags:
      - User
      summary: Update a user-level variable which is created by current doer
      operationId: updateUserVariable
      parameters:
      - description: name of the variable
        name: variablename
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: response when updating a variable
        '204':
          description: response when updating a variable
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVariableOption'
    post:
      tags:
      - User
      summary: Create a user-level variable
      operationId: createUserVariable
      parameters:
      - description: name of the variable
        name: variablename
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: successfully created the user-level variable
        '400':
          $ref: '#/components/responses/error'
        '409':
          description: variable name already exists.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVariableOption'
    delete:
      tags:
      - User
      summary: Delete a user-level variable which is created by current doer
      operationId: deleteUserVariable
      parameters:
      - description: name of the variable
        name: variablename
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: response when deleting a variable
        '204':
          description: response when deleting a variable
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
  /user/applications/oauth2:
    get:
      tags:
      - User
      summary: List the authenticated user's oauth2 applications
      operationId: userGetOauth2Application
      parameters:
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/OAuth2ApplicationList'
    post:
      tags:
      - User
      summary: creates a new OAuth2 application
      operationId: userCreateOAuth2Application
      responses:
        '201':
          $ref: '#/components/responses/OAuth2Application'
        '400':
          $ref: '#/components/responses/error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOAuth2ApplicationOptions'
        required: true
  /user/applications/oauth2/{id}:
    get:
      tags:
      - User
      summary: get an OAuth2 Application
      operationId: userGetOAuth2Application
      parameters:
      - description: Application ID to be found
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/OAuth2Application'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      tags:
      - User
      summary: delete an OAuth2 Application
      operationId: userDeleteOAuth2Application
      parameters:
      - description: token to be deleted
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '404':
          $ref: '#/components/responses/notFound'
    patch:
      tags:
      - User
      summary: update an OAuth2 Application, this includes regenerating the client secret
      operationId: userUpdateOAuth2Application
      parameters:
      - description: application to be updated
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/OAuth2Application'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOAuth2ApplicationOptions'
        required: true
  /user/avatar:
    post:
      tags:
      - User
      summary: Update Avatar
      operationId: userUpdateAvatar
      responses:
        '204':
          $ref: '#/components/responses/empty'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserAvatarOption'
    delete:
      tags:
      - User
      summary: Delete Avatar
      operationId: userDeleteAvatar
      responses:
        '204':
          $ref: '#/components/responses/empty'
  /user/blocks:
    get:
      tags:
      - User
      summary: List users blocked by the authenticated user
      operationId: userListBlocks
      parameters:
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/UserList'
  /user/blocks/{username}:
    get:
      tags:
      - User
      summary: Check if a user is blocked by the authenticated user
      operationId: userCheckUserBlock
      parameters:
      - description: username of the user to check
        name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '404':
          $ref: '#/components/responses/notFound'
    put:
      tags:
      - User
      summary: Block a user
      operationId: userBlockUser
      parameters:
      - description: username of the user to block
        name: username
        in: path
        required: true
        schema:
          type: string
      - description: optional note for the block
        name: note
        in: query
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/validationError'
    delete:
      tags:
      - User
      summary: Unblock a user
      operationId: userUnblockUser
      parameters:
      - description: username of the user to unblock
        name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/validationError'
  /user/emails:
    get:
      tags:
      - User
      summary: List the authenticated user's email addresses
      operationId: userListEmails
      responses:
        '200':
          $ref: '#/components/responses/EmailList'
    post:
      tags:
      - User
      summary: Add email addresses
      operationId: userAddEmail
      responses:
        '201':
          $ref: '#/components/responses/EmailList'
        '400':
          $ref: '#/components/responses/error'
        '409':
          $ref: '#/components/responses/error'
        '422':
          $ref: '#/components/responses/validationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmailOption'
    delete:
      tags:
      - User
      summary: Delete email addresses
      operationId: userDeleteEmail
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '404':
          $ref: '#/components/responses/notFound'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteEmailOption'
  /user/followers:
    get:
      tags:
      - User
      summary: List the authenticated user's followers
      operationId: userCurrentListFollowers
      parameters:
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/UserList'
  /user/following:
    get:
      tags:
      - User
      summary: List the users that the authenticated user is following
      operationId: userCurrentListFollowing
      parameters:
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/UserList'
  /user/following/{username}:
    get:
      tags:
      - User
      summary: Check whether a user is followed by the authenticated user
      operationId: userCurrentCheckFollowing
      parameters:
      - description: username of the user to check for authenticated followers
        name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '404':
          $ref: '#/components/responses/notFound'
    put:
      tags:
      - User
      summary: Follow a user
      operationId: userCurrentPutFollow
      parameters:
      - description: username of the user to follow
        name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      tags:
      - User
      summary: Unfollow a user
      operationId: userCurrentDeleteFollow
      parameters:
      - description: username of the user to unfollow
        name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '404':
          $ref: '#/components/responses/notFound'
  /user/gpg_key_token:
    get:
      tags:
      - User
      summary: Get a Token to verify
      operationId: getVerificationToken
      responses:
        '200':
          $ref: '#/components/responses/string'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
  /user/gpg_key_verify:
    post:
      tags:
      - User
      summary: Verify a GPG key
      operationId: userVerifyGPGKey
      responses:
        '201':
          $ref: '#/components/responses/GPGKey'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/validationError'
  /user/gpg_keys:
    get:
      tags:
      - User
      summary: List the authenticated user's GPG keys
      operationId: userCurrentListGPGKeys
      parameters:
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/GPGKeyList'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
    post:
      tags:
      - User
      summary: Create a GPG key
      operationId: userCurrentPostGPGKey
      responses:
        '201':
          $ref: '#/components/responses/GPGKey'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/validationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGPGKeyOption'
  /user/gpg_keys/{id}:
    get:
      tags:
      - User
      summary: Get a GPG key
      operationId: userCurrentGetGPGKey
      parameters:
      - description: id of key to get
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/GPGKey'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      tags:
      - User
      summary: Remove a GPG key
      operationId: userCurrentDeleteGPGKey
      parameters:
      - description: id of key to delete
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
  /user/hooks:
    get:
      tags:
      - User
      summary: List the authenticated user's webhooks
      operationId: userListHooks
      parameters:
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/HookList'
    post:
      tags:
      - User
      summary: Create a hook
      operationId: userCreateHook
      responses:
        '201':
          $ref: '#/components/responses/Hook'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHookOption'
        required: true
  /user/hooks/{id}:
    get:
      tags:
      - User
      summary: Get a hook
      operationId: userGetHook
      parameters:
      - description: id of the hook to get
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/Hook'
    delete:
      tags:
      - User
      summary: Delete a hook
      operationId: userDeleteHook
      parameters:
      - description: id of the hook to delete
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          $ref: '#/components/responses/empty'
    patch:
      tags:
      - User
      summary: Update a hook
      operationId: userEditHook
      parameters:
      - description: id of the hook to update
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/Hook'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditHookOption'
  /user/keys:
    get:
      tags:
      - User
      summary: List the authenticated user's public keys
      operationId: userCurrentListKeys
      parameters:
      - description: fingerprint of the key
        name: fingerprint
        in: query
        schema:
          type: string
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/PublicKeyList'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
    post:
      tags:
      - User
      summary: Create a public key
      operationId: userCurrentPostKey
      responses:
        '201':
          $ref: '#/components/responses/PublicKey'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '422':
          $ref: '#/components/responses/validationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeyOption'
  /user/keys/{id}:
    get:
      tags:
      - User
      summary: Get a public key
      operationId: userCurrentGetKey
      parameters:
      - description: id of key to get
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/PublicKey'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      tags:
      - User
      summary: Delete a public key
      operationId: userCurrentDeleteKey
      parameters:
      - description: id of key to delete
        name: id
        in: path
        required: true
        schema:
          type: integer
