openapi: 3.2.0
info:
  description: This documentation describes the Gitea API.
  title: Gitea Repository API
  license:
    name: MIT
    url: http://opensource.org/licenses/MIT
  version: 1.27.0+dev-89-gf52b6f3315
servers:
- url: /api/v1
security:
- BasicAuth: []
- Token: []
- AccessToken: []
- AuthorizationHeaderToken: []
- SudoParam: []
- SudoHeader: []
- TOTPHeader: []
tags:
- name: Repository
paths:
  /repos/migrate:
    post:
      tags:
      - Repository
      summary: Migrate a remote git repository
      operationId: repoMigrate
      responses:
        '201':
          $ref: '#/components/responses/Repository'
        '403':
          $ref: '#/components/responses/forbidden'
        '409':
          description: The repository with the same name already exists.
        '422':
          $ref: '#/components/responses/validationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrateRepoOptions'
  /repos/search:
    get:
      tags:
      - Repository
      summary: Search for repositories
      operationId: repoSearch
      parameters:
      - description: keyword
        name: q
        in: query
        schema:
          type: string
      - description: Limit search to repositories with keyword as topic
        name: topic
        in: query
        schema:
          type: boolean
      - description: include search of keyword within repository description
        name: includeDesc
        in: query
        schema:
          type: boolean
      - description: search only for repos that the user with the given id owns or contributes to
        name: uid
        in: query
        schema:
          type: integer
          format: int64
      - description: repo owner to prioritize in the results
        name: priority_owner_id
        in: query
        schema:
          type: integer
          format: int64
      - description: search only for repos that belong to the given team id
        name: team_id
        in: query
        schema:
          type: integer
          format: int64
      - description: search only for repos that the user with the given id has starred
        name: starredBy
        in: query
        schema:
          type: integer
          format: int64
      - description: include private repositories this user has access to (defaults to true)
        name: private
        in: query
        schema:
          type: boolean
      - description: show only pubic, private or all repositories (defaults to all)
        name: is_private
        in: query
        schema:
          type: boolean
      - description: include template repositories this user has access to (defaults to true)
        name: template
        in: query
        schema:
          type: boolean
      - description: show only archived, non-archived or all repositories (defaults to all)
        name: archived
        in: query
        schema:
          type: boolean
      - description: type of repository to search for. Supported values are "fork", "source", "mirror" and "collaborative"
        name: mode
        in: query
        schema:
          type: string
      - description: if `uid` is given, search only for repos that the user owns
        name: exclusive
        in: query
        schema:
          type: boolean
      - description: sort repos by attribute. Supported values are "alpha", "created", "updated", "size", "git_size", "lfs_size", "stars", "forks" and "id". Default is "alpha"
        name: sort
        in: query
        schema:
          type: string
      - description: sort order, either "asc" (ascending) or "desc" (descending). Default is "asc", ignored if "sort" is not specified.
        name: order
        in: query
        schema:
          type: string
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/SearchResults'
        '422':
          $ref: '#/components/responses/validationError'
  /repos/{owner}/{repo}:
    get:
      tags:
      - Repository
      summary: Get a repository
      operationId: repoGet
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/Repository'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      tags:
      - Repository
      summary: Delete a repository
      operationId: repoDelete
      parameters:
      - description: owner of the repo to delete
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo to delete
        name: repo
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/empty'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
    patch:
      tags:
      - Repository
      summary: Edit a repository's properties. Only fields that are set will be changed
      operationId: repoEdit
      parameters:
      - description: owner of the repo to edit
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo to edit
        name: repo
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/Repository'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/validationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditRepoOption'
        description: Properties of a repo that you can edit
  /repos/{owner}/{repo}/actions/artifacts:
    get:
      tags:
      - Repository
      summary: Lists all artifacts for a repository
      operationId: getArtifacts
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repository
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: name of the artifact
        name: name
        in: query
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/ArtifactsList'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
  /repos/{owner}/{repo}/actions/artifacts/{artifact_id}:
    get:
      tags:
      - Repository
      summary: Gets a specific artifact for a workflow run
      operationId: getArtifact
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repository
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: id of the artifact
        name: artifact_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/Artifact'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      tags:
      - Repository
      summary: Deletes a specific artifact for a workflow run
      operationId: deleteArtifact
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repository
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: id of the artifact
        name: artifact_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
  /repos/{owner}/{repo}/actions/artifacts/{artifact_id}/zip:
    get:
      tags:
      - Repository
      summary: Downloads a specific artifact for a workflow run redirects to blob url
      operationId: downloadArtifact
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repository
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: id of the artifact
        name: artifact_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '302':
          description: redirect to the blob download
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
  /repos/{owner}/{repo}/actions/jobs:
    get:
      tags:
      - Repository
      summary: Lists all jobs for a repository
      operationId: listWorkflowJobs
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repository
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: workflow status (pending, queued, in_progress, failure, success, skipped)
        name: status
        in: query
        schema:
          type: string
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/WorkflowJobsList'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
  /repos/{owner}/{repo}/actions/jobs/{job_id}:
    get:
      tags:
      - Repository
      summary: Gets a specific workflow job for a workflow run
      operationId: getWorkflowJob
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repository
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: id of the job
        name: job_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/WorkflowJob'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
  /repos/{owner}/{repo}/actions/jobs/{job_id}/logs:
    get:
      tags:
      - Repository
      summary: Downloads the job logs for a workflow run
      operationId: downloadActionsRunJobLogs
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repository
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: id of the job
        name: job_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: output blob content
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
  /repos/{owner}/{repo}/actions/runners:
    get:
      tags:
      - Repository
      summary: Get repo-level runners
      operationId: getRepoRunners
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: filter by disabled status (true or false)
        name: disabled
        in: query
        schema:
          type: boolean
      responses:
        '200':
          $ref: '#/components/responses/RunnerList'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
  /repos/{owner}/{repo}/actions/runners/registration-token:
    post:
      tags:
      - Repository
      summary: Get a repository's actions runner registration token
      operationId: repoCreateRunnerRegistrationToken
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/RegistrationToken'
  /repos/{owner}/{repo}/actions/runners/{runner_id}:
    get:
      tags:
      - Repository
      summary: Get a repo-level runner
      operationId: getRepoRunner
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: id of the runner
        name: runner_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/Runner'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      tags:
      - Repository
      summary: Delete a repo-level runner
      operationId: deleteRepoRunner
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: id of the runner
        name: runner_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: runner has been deleted
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
    patch:
      tags:
      - Repository
      summary: Update a repo-level runner
      operationId: updateRepoRunner
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: id of the runner
        name: runner_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/Runner'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/validationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditActionRunnerOption'
  /repos/{owner}/{repo}/actions/runs:
    get:
      tags:
      - Repository
      summary: Lists all runs for a repository run
      operationId: getWorkflowRuns
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repository
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: workflow event name
        name: event
        in: query
        schema:
          type: string
      - description: workflow branch
        name: branch
        in: query
        schema:
          type: string
      - description: workflow status (pending, queued, in_progress, failure, success, skipped)
        name: status
        in: query
        schema:
          type: string
      - description: triggered by user
        name: actor
        in: query
        schema:
          type: string
      - description: triggering sha of the workflow run
        name: head_sha
        in: query
        schema:
          type: string
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/WorkflowRunsList'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
  /repos/{owner}/{repo}/actions/runs/{run}:
    get:
      tags:
      - Repository
      summary: Gets a specific workflow run
      operationId: GetWorkflowRun
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repository
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: id of the run
        name: run
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/WorkflowRun'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
    delete:
      tags:
      - Repository
      summary: Delete a workflow run
      operationId: deleteActionRun
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repository
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: runid of the workflow run
        name: run
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
  /repos/{owner}/{repo}/actions/runs/{run}/artifacts:
    get:
      tags:
      - Repository
      summary: Lists all artifacts for a repository run
      operationId: getArtifactsOfRun
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repository
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: runid of the workflow run
        name: run
        in: path
        required: true
        schema:
          type: integer
      - description: name of the artifact
        name: name
        in: query
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/ArtifactsList'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
  /repos/{owner}/{repo}/actions/runs/{run}/jobs:
    get:
      tags:
      - Repository
      summary: Lists all jobs for a workflow run
      operationId: listWorkflowRunJobs
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repository
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: runid of the workflow run
        name: run
        in: path
        required: true
        schema:
          type: integer
      - description: workflow status (pending, queued, in_progress, failure, success, skipped)
        name: status
        in: query
        schema:
          type: string
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/WorkflowJobsList'
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
  /repos/{owner}/{repo}/actions/runs/{run}/jobs/{job_id}/rerun:
    post:
      tags:
      - Repository
      summary: Reruns a specific workflow job in a run
      operationId: rerunWorkflowJob
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repository
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: id of the run
        name: run
        in: path
        required: true
        schema:
          type: integer
      - description: id of the job
        name: job_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '201':
          $ref: '#/components/responses/WorkflowJob'
        '400':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/validationError'
  /repos/{owner}/{repo}/actions/runs/{run}/rerun:
    post:
      tags:
      - Repository
      summary: Reruns an entire workflow run
      operationId: rerunWorkflowRun
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repository
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: id of the run
        name: run
        in: path
        required: true
        schema:
          type: integer
      responses:
        '201':
          $ref: '#/components/responses/WorkflowRun'
        '400':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/validationError'
  /repos/{owner}/{repo}/actions/runs/{run}/rerun-failed-jobs:
    post:
      tags:
      - Repository
      summary: Reruns all failed jobs in a workflow run
      operationId: rerunFailedWorkflowRun
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repository
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: id of the run
        name: run
        in: path
        required: true
        schema:
          type: integer
      responses:
        '201':
          $ref: '#/components/responses/empty'
        '400':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/validationError'
  /repos/{owner}/{repo}/actions/secrets:
    get:
      tags:
      - Repository
      summary: List an repo's actions secrets
      operationId: repoListActionsSecrets
      parameters:
      - description: owner of the repo
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repository
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: page number of results to return (1-based)
        name: page
        in: query
        schema:
          type: integer
      - description: page size of results
        name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          $ref: '#/components/responses/SecretList'
        '404':
          $ref: '#/components/responses/notFound'
  /repos/{owner}/{repo}/actions/secrets/{secretname}:
    put:
      tags:
      - Repository
      summary: Create or Update a secret value in a repository
      operationId: updateRepoSecret
      parameters:
      - description: owner of the repository
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repository
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: name of the secret
        name: secretname
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: response when creating a secret
        '204':
          description: response when updating a secret
        '400':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/notFound'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateSecretOption'
    delete:
      tags:
      - Repository
      summary: Delete a secret in a repository
      operationId: deleteRepoSecret
      parameters:
      - description: owner of the repository
        name: owner
        in: path
        required: true
        schema:
          type: string
      - description: name of the repository
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: name of the secret
        name: secretname
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
