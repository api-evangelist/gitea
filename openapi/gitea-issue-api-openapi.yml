      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                attachment:
                  type: string
                  description: attachment to upload
                  format: binary
              required:
              - attachment
  /repos/{owner}/{repo}/issues/comments/{id}/assets/{attachment_id}:
