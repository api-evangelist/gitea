        required: true
        schema:
          type: string
      - description: id of the comment
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - description: id of the attachment to get
        name: attachment_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
