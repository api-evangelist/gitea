      - description: name of the repo
        name: repo
        in: path
        required: true
        schema:
          type: string
      - description: id of the comment to edit
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          $ref: '#/components/responses/Reaction'
        '201':
          $ref: '#/components/responses/Reaction'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
      requestBody:
